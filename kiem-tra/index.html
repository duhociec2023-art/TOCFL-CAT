<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mini-CAT 當代中文 L1–5</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
/* Layout: one narrow exam column; header strip carries section, step counter and 90-min clock; level meter is the one visual signature */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.hud{display:flex;gap:12px;align-items:center}
.step{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.clock{font-family:var(--f-num);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.clock.warn{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:24px} h2{font-size:18px}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 14px;font-size:14px}
.lessons span{font-family:var(--f-zh)}
.lessons b{font-family:var(--f-num);font-weight:500;color:var(--accent);margin-right:6px}
ul.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
input[type=text]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent;padding:11px 18px;font-weight:600}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--surface)}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.steps{display:flex;align-items:flex-end;gap:3px}
.steps i{display:block;width:14px;border-radius:2px;background:var(--line)}
.steps i:nth-child(1){height:8px}.steps i:nth-child(2){height:14px}.steps i:nth-child(3){height:20px}
.steps i.on{background:var(--gold)}
.passage{font-family:var(--f-zh);font-size:19px;line-height:1.9;background:var(--bg);border-radius:8px;padding:14px 16px}
.figure{display:flex;justify-content:center;background:var(--bg);border-radius:8px;padding:10px}
.figure svg{width:220px;max-width:100%;height:auto}
.q{font-family:var(--f-zh);font-size:19px;font-weight:700}
.q.qv{font-family:var(--f-ui);font-size:16px;font-weight:600}
.cast{font-size:13px;color:var(--muted);margin:0}.cast .zht{font-family:var(--f-zh);color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:var(--f-zh);font-size:18px;font-weight:500;padding:12px 14px;min-width:0}
.opts.pics .opt{flex-direction:column;gap:6px;padding:10px 6px}
.opts.pics .opt svg{width:100%;max-width:120px;height:auto}
.opt .k{font-family:var(--f-num);font-size:13px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed=true] .k{background:var(--accent);border-color:var(--accent);color:var(--surface)}
/* pictograms */
.pic *{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pic .f{fill:var(--accent-soft)} .pic .a{fill:var(--accent)} .pic .g{fill:var(--gold)} .pic .r{fill:var(--bad)} .pic .w{fill:var(--surface)}
.pic text{fill:var(--ink);stroke:none;font:600 13px var(--f-num)}
.play{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.notice{font-size:13px;background:var(--bad-soft);color:var(--ink);border-radius:8px;padding:10px 12px}
.transcript{font-family:var(--f-zh);font-size:17px;line-height:1.8;border-left:3px solid var(--line);padding-left:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.big{font-family:var(--f-num);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
svg.trace{width:100%;height:auto;max-width:100%}
.trace .grid{stroke:var(--line);stroke-width:1}
.trace .path{fill:none;stroke:var(--accent);stroke-width:2}
.trace .dot-ok{fill:var(--ok)} .trace .dot-bad{fill:var(--surface);stroke:var(--bad);stroke-width:2}
.trace text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
td.zht{font-family:var(--f-zh)}
.barcell{display:flex;align-items:center;gap:8px}
.hbar{flex:1;height:6px;background:var(--line);border-radius:3px;min-width:60px;overflow:hidden}
.hbar span{display:block;height:100%;background:var(--accent)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
.rev{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.rev>div{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--bg)}
.rev .zhs{font-family:var(--f-zh);font-size:16px}
.tag-ok{color:var(--ok);font-weight:600}.tag-bad{color:var(--bad);font-weight:600}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

<div class="wrap">
  <div class="bar">
    <div class="brand">Mini-CAT · 當代中文 L1–5<small>Bài kiểm tra thích ứng Nghe + Đọc</small></div>
    <div class="hud"><span class="step" id="step"></span><span class="clock" id="clock" hidden></span></div>
  </div>
  <main id="app"></main>
</div>

<script>
const LESSONS={1:"歡迎你來臺灣",2:"我的家人",3:"週末做什麼",4:"多少錢",5:"牛肉麵真好吃"};
const LEVELS={1:"Mức 1 · Nhận diện từ",2:"Mức 2 · Hiểu câu",3:"Mức 3 · Hiểu hội thoại/đoạn văn"};
/* ---------- chấm điểm (thang 100 = Nghe 50 + Đọc 50) ----------
   Ước lượng năng lực θ theo mô hình IRT (Rasch) với độ khó câu b = 1, 2, 3:
   P(đúng) = 1/(1+e^(-1.7(θ-b))). Tìm θ khớp nhất với chuỗi đúng/sai (có kéo nhẹ về 2 để ổn định),
   rồi đổi θ 0.5 → 0 điểm, θ 3.5 → 50 điểm. Câu khó làm đúng được tính nhiều hơn câu dễ. */
function theta(h){if(!h.length)return null;let best=2,bl=-1e9;
  for(let t=0;t<=4.0001;t+=0.05){let l=-((t-2)**2)/2;
    for(const x of h){const p=1/(1+Math.exp(-1.7*(t-x.item.lv)));l+=Math.log(x.ok?p:1-p)}
    if(l>bl){bl=l;best=t}}return best}
const secPoints=h=>{const t=theta(h);return t===null?0:Math.round(Math.min(1,Math.max(0,(t-.5)/3))*50)};
const secLevel=h=>{const t=theta(h);return t===null?"Chưa làm":LEVELS[t<1.5?1:t<2.5?2:3]};
const GRADES=[[80,"Giỏi","Vững L1–5, học tiếp từ L6"],[65,"Khá","Ôn nhanh các bài yếu rồi học tiếp L6"],
  [50,"Trung bình","Ôn lại L1–5, tập trung các bài yếu"],[0,"Yếu","Học lại từ L1"]];
const grade=p=>GRADES.find(g=>p>=g[0]);
const LEN={L:20,R:20};          // số câu mỗi phần
const MINUTES=50;              // thời gian làm bài
const SHEET_URL="https://script.google.com/macros/s/AKfycbwfds7-FgNisDb-te3SpLgdC5Kyrav8_hgrdG586-lYwn6qZK7fKOhsjFBbmvFPc8PdQQ/exec";            // link /exec của Google Apps Script (để trống = không gửi)
const ZN=["","一","兩","三","四","五"];

/* ---------- pictograms (vẽ tay bằng SVG, không dùng ảnh có bản quyền) ---------- */
const mug=(x,y)=>`<path class="f" d="M${x} ${y}h28v24a8 8 0 0 1-8 8h-12a8 8 0 0 1-8-8z"/><path d="M${x+28} ${y+6}a7 7 0 0 1 0 14"/><path d="M${x+9} ${y-5}q-4-5 0-10M${x+19} ${y-5}q-4-5 0-10"/>`;
const bowl=cx=>`<path class="f" d="M${cx-22} 46h44a22 22 0 0 1-44 0z"/><path d="M${cx-8} 72h16"/><path d="M${cx-15} 44q4-8 8 0q4-8 8 0q4-8 8 0"/><path d="M${cx+2} 42l18-26M${cx+8} 44l18-24"/>`;
const fig=(x,h)=>{const t=82-h;return `<circle class="f" cx="${x}" cy="${t}" r="6"/><path d="M${x} ${t+6}V68M${x} ${t+13}l-8 8M${x} ${t+13}l8 8M${x} 68l-6 14M${x} 68l6 14"/>`};
const phoneAt=x=>`<rect class="f" x="${x}" y="12" width="32" height="66" rx="6"/><rect class="w" x="${x+5}" y="20" width="22" height="44" rx="2"/><circle class="a" cx="${x+16}" cy="71" r="2.5"/>`;
const DRAW={
  coffee:n=>{n=+n||1;const s=60-n*22+6;return Array.from({length:n},(_,i)=>mug(s+i*44,38)).join("")},
  bun:n=>{n=+n||1;const s=60-(n-1)*24;return Array.from({length:n},(_,i)=>{const x=s+i*48;return `<path class="w" d="M${x-24} 64q0-32 24-32q24 0 24 32z"/><path d="M${x-8} 40q8 6 16 0M${x} 33v8"/><path d="M${x-30} 64h60"/>`}).join("")},
  tea:()=>`<ellipse class="f" cx="58" cy="56" rx="26" ry="19"/><path d="M33 52q-14-2-16-16"/><path d="M83 46q14 0 12 16q-2 10-12 10"/><path class="f" d="M46 38q12-10 24 0z"/><circle class="a" cx="58" cy="30" r="3"/>`,
  noodle:n=>{n=+n||1;const s=60-(n-1)*26;return Array.from({length:n},(_,i)=>bowl(s+i*52)).join("")},
  spicy:()=>bowl(46)+`<path class="r" d="M92 28q12 2 8 20q-4 14-14 20q6-14 2-38z"/><path d="M94 28q2-7 7-9"/>`,
  bball:()=>`<circle class="g" cx="60" cy="45" r="28"/><path d="M60 17v56M32 45h56M41 25q14 20 0 40M79 25q-14 20 0 40"/>`,
  tennis:()=>`<ellipse class="f" cx="50" cy="36" rx="17" ry="23" transform="rotate(-25 50 36)"/><path d="M60 57l14 24M43 20l12 30M36 34l26-10"/><circle class="g" cx="90" cy="30" r="8"/><path d="M83 26q7 4 14 0"/>`,
  swim:()=>`<path d="M10 58q10-8 20 0t20 0t20 0t20 0t20 0"/><path d="M10 74q10-8 20 0t20 0t20 0t20 0t20 0"/><circle class="f" cx="50" cy="44" r="8"/><path d="M60 44q16-18 30-4"/>`,
  movie:()=>`<rect class="f" x="26" y="40" width="68" height="38" rx="3"/><path class="a" d="M26 40l62-18l3 11l-62 18z"/><path d="M42 36l-2-7M58 31l-2-7M74 27l-2-7"/><path d="M50 52l14 8l-14 8z"/>`,
  music:()=>`<path d="M34 58v-10a26 26 0 0 1 52 0v10"/><rect class="a" x="26" y="52" width="14" height="22" rx="5"/><rect class="a" x="80" y="52" width="14" height="22" rx="5"/>`,
  phone:()=>phoneAt(44),
  family:n=>{n=+n||4;const hs=[50,46,36,32,28];return Array.from({length:n},(_,i)=>fig(10+(i+.5)*100/n,hs[i])).join("")},
  tag:t=>`<path class="g" d="M14 30h66l22 15l-22 15h-66z"/><circle class="w" cx="88" cy="45" r="3"/><text x="47" y="50" text-anchor="middle">${t}</text>`,
  phonetag:t=>phoneAt(8)+`<path class="g" d="M46 34h52l16 12l-16 12h-52z"/><text x="74" y="51" text-anchor="middle">${t}</text>`,
};
const ALT={coffee:n=>`${ZN[+n||1]}杯熱咖啡`,bun:n=>`${ZN[+n||1]}個包子`,tea:()=>"茶",noodle:n=>`${ZN[+n||1]}碗牛肉麵`,spicy:()=>"很辣的牛肉麵",
  bball:()=>"打籃球",tennis:()=>"打網球",swim:()=>"游泳",movie:()=>"看電影",music:()=>"聽音樂",phone:()=>"手機",
  family:n=>`${ZN[+n]}個人的家`,tag:t=>`${t}`,phonetag:t=>`手機 ${t}`};
const split=s=>{const i=s.indexOf(":");return i<0?[s,""]:[s.slice(0,i),s.slice(i+1)]};
const pic=(s,lbl)=>{const[n,a]=split(s);return `<svg class="pic" viewBox="0 0 120 90" role="img" aria-label="${lbl||"Hình"}">${DRAW[n](a)}</svg>`};
const alt=s=>{const[n,a]=split(s);return ALT[n](a)};

/* ---------- ngân hàng câu hỏi ----------
   CHỈ dùng từ vựng 當代中文課程 第一冊 L1–L5. Lời hướng dẫn viết bằng tiếng Việt (vì 選、圖、句子、回答、最… chưa học).
   s: L nghe / R đọc · les: bài · lv: độ khó 1–3 · a: lời đọc [nhân vật, câu] · t: đoạn văn
   img: hình kèm câu hỏi · po: đáp án là hình · o: đáp án (phương án đúng luôn đặt đầu, khi hiển thị sẽ xáo) · g: nhóm cùng đoạn văn */
const Q_REPLY="Câu đáp nào phù hợp nhất?",Q_PICK="Nghe và chọn hình đúng.",Q_IMG="Nhìn hình, chọn câu đúng.",
      Q_FILL="Chọn từ phù hợp điền vào chỗ trống.",Q_GRAM="Câu nào đúng ngữ pháp?",Q_TRUE="Câu nào đúng với nội dung?";
const BANK=[
// ===== NGHE · mức 1
{s:"L",les:1,lv:1,a:[["","我是日本人。"]],q:"他是哪國人？",o:["日本人","美國人","臺灣人"]},
{s:"L",les:1,lv:1,a:[["","我要喝咖啡。"]],q:"他要喝什麼？",o:["咖啡","茶","牛肉湯"]},
{s:"L",les:2,lv:1,a:[["","我有兩個哥哥。"]],q:"他有幾個哥哥？",o:["兩個","一個","三個"]},
{s:"L",les:2,lv:1,a:[["","這是我媽媽。"]],q:"這是誰？",o:["他媽媽","他爸爸","他姐姐"]},
{s:"L",les:3,lv:1,a:[["","我週末常打籃球。"]],q:"他週末常做什麼？",o:["打籃球","打網球","游泳"]},
{s:"L",les:3,lv:1,a:[["","我喜歡看電影。"]],q:"他喜歡做什麼？",o:["看電影","聽音樂","打網球"]},
{s:"L",les:4,lv:1,a:[["","這支手機八千塊。"]],q:"手機多少錢？",o:["八千塊","八百塊","一千八百塊"]},
{s:"L",les:4,lv:1,a:[["","我要一杯熱咖啡。"]],q:"他要什麼？",o:["熱咖啡","熱茶","包子"]},
{s:"L",les:5,lv:1,a:[["","牛肉麵很好吃。"]],q:"什麼很好吃？",o:["牛肉麵","包子","越南菜"]},
{s:"L",les:5,lv:1,a:[["","我很喜歡吃臺灣的牛肉麵。"]],q:"他喜歡吃什麼？",o:["牛肉麵","包子","越南菜"]},
// NGHE · mức 1 · chọn hình
{s:"L",les:1,lv:1,po:1,a:[["","我喜歡喝茶。"]],q:Q_PICK,o:["tea","coffee:1","noodle:1"]},
{s:"L",les:4,lv:1,po:1,a:[["","老闆，我要一個包子。"]],q:Q_PICK,o:["bun:1","coffee:1","tea"]},
{s:"L",les:3,lv:1,po:1,a:[["","我週末常去游泳。"]],q:Q_PICK,o:["swim","bball","tennis"]},
{s:"L",les:3,lv:1,po:1,a:[["","我哥哥喜歡打網球。"]],q:Q_PICK,o:["tennis","bball","swim"]},
{s:"L",les:3,lv:1,po:1,a:[["","明天我們一起去看電影。"]],q:Q_PICK,o:["movie","music","phone"]},
{s:"L",les:3,lv:1,po:1,a:[["","我姐姐喜歡聽音樂。"]],q:Q_PICK,o:["music","movie","tennis"]},
{s:"L",les:4,lv:1,po:1,a:[["","我想買一支新手機。"]],q:Q_PICK,o:["phone","coffee:1","movie"]},
{s:"L",les:5,lv:1,po:1,a:[["","老闆，我要一碗牛肉麵。"]],q:Q_PICK,o:["noodle:1","noodle:2","coffee:1"]},
// ===== NGHE · mức 2 (chọn câu đáp)
{s:"L",les:1,lv:2,a:[["","你叫什麼名字？"]],q:Q_REPLY,o:["我叫李明華。","我是美國人。","我喜歡喝茶。"]},
{s:"L",les:1,lv:2,a:[["","你是哪國人？"]],q:Q_REPLY,o:["我是日本人。","我姓王。","我不喝咖啡。"]},
{s:"L",les:1,lv:2,a:[["","你喝不喝咖啡？"]],q:Q_REPLY,o:["我不喝，謝謝。","我不是咖啡。","咖啡是美國人。"]},
{s:"L",les:2,lv:2,a:[["","你家有幾個人？"]],q:Q_REPLY,o:["我家有五個人。","這是我家。","我有照片。"]},
{s:"L",les:2,lv:2,a:[["","這個人是誰？"]],q:Q_REPLY,o:["是我哥哥。","這是我的照片。","照片很好看。"]},
{s:"L",les:2,lv:2,a:[["","你有哥哥嗎？"]],q:Q_REPLY,o:["有，我有一個哥哥。","是，我是哥哥。","哥哥很好看嗎？"]},
{s:"L",les:3,lv:2,a:[["","你週末想做什麼？"]],q:Q_REPLY,o:["我想去看電影。","我是老師。","電影很好看嗎？"]},
{s:"L",les:3,lv:2,a:[["","明天晚上我們一起去打網球，好不好？"]],q:Q_REPLY,o:["好啊，我也想去。","我不是網球。","我有一個網球老師。"]},
{s:"L",les:3,lv:2,a:[["","你喜歡什麼運動？"]],q:Q_REPLY,o:["我喜歡打籃球。","我喜歡喝咖啡。","運動很好看。"]},
{s:"L",les:4,lv:2,a:[["","請問這杯咖啡多少錢？"]],q:Q_REPLY,o:["六十五塊。","我要熱的。","很好喝。"]},

/* ---------- trạng thái ---------- */
const app=document.getElementById("app"),stepEl=document.getElementById("step"),clockEl=document.getElementById("clock");
let S,timer=null;
function reset(){S={name:"",sec:null,secs:{L:mk(),R:mk()},cur:null,choice:null,plays:0,deadline:0,timeUp:false};
  if(timer){clearInterval(timer);timer=null}clockEl.hidden=true}
function mk(){return{level:2,streak:0,used:new Set(),groups:new Set(),hist:[]}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const meter=lv=>`<span class="steps" aria-hidden="true">${[1,2,3].map(n=>`<i class="${n<=lv?"on":""}"></i>`).join("")}</span>`;
const optText=(it,i)=>it.po?alt(it.o[i]):it.o[i];

/* ---------- đồng hồ 90 phút ---------- */
function startClock(){S.deadline=Date.now()+MINUTES*60000;clockEl.hidden=false;tick();timer=setInterval(tick,1000)}
function tick(){const ms=Math.max(0,S.deadline-Date.now()),m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);
  clockEl.textContent=`⏱ ${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  clockEl.classList.toggle("warn",ms<=10*60000);
  if(ms<=0){S.timeUp=true;if(synth)synth.cancel();results()}}

/* ---------- giọng đọc ---------- */
const synth=window.speechSynthesis||null;let voice=null;
function pickVoice(){if(!synth)return;const v=synth.getVoices();
  voice=v.find(x=>/zh[-_]TW/i.test(x.lang))||v.find(x=>/zh[-_](HK|Hant)/i.test(x.lang))||v.find(x=>/^zh|cmn/i.test(x.lang))||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
const FEMALE=new Set(["月美","怡君","如玉","秋香"]);
const cast=a=>{const n=[...new Set(a.map(x=>x[0]).filter(Boolean))];return n.length?`<p class="cast">Nhân vật: ${n.map(x=>`<b class="zht">${x}</b> (${FEMALE.has(x)?"nữ":"nam"})`).join(" · ")}</p>`:""};
function speak(lines,done){if(!synth){done&&done();return}synth.cancel();
  lines.forEach(([sp,txt],i)=>{const u=new SpeechSynthesisUtterance(txt);
    u.lang=voice?voice.lang:"zh-TW";if(voice)u.voice=voice;u.rate=.85;
    u.pitch=FEMALE.has(sp)?1.35:sp==="老闆"?1:sp?.72:1;
    if(i===lines.length-1)u.onend=()=>done&&done();synth.speak(u)})}

/* ---------- màn hình ---------- */
function intro(){stepEl.textContent="";
app.innerHTML=`<section class="card">
  <span class="label">Phạm vi</span>
  <h1>Bài kiểm tra thích ứng 5 bài đầu 《當代中文課程》第一冊</h1>
  <div class="lessons">${Object.entries(LESSONS).map(([n,t])=>`<div><b>L${n}</b><span>${t}</span></div>`).join("")}</div>
  <span class="label">Cách làm</span>
  <ul class="rules">
    <li>Thời gian: <b>${MINUTES} phút</b> cho cả bài. Hết giờ, bài tự nộp.</li>
    <li>Hai phần: <b>Nghe</b> (${LEN.L} câu) rồi <b>Đọc</b> (${LEN.R} câu). Có câu chọn hình, câu chọn đáp án và đoạn văn ngắn.</li>
    <li>Đề tự đổi độ khó theo bạn: đúng 2 câu liền thì câu sau khó hơn, sai thì câu sau dễ hơn.</li>
    <li>Không quay lại câu trước được. Mỗi câu nghe được phát tối đa 2 lần.</li>
    <li>Phần Nghe cần bật loa hoặc đeo tai nghe.</li>
  </ul>
  <label class="label" for="nm">Họ tên học viên</label>
  <input type="text" id="nm" placeholder="Ví dụ: Nguyễn Văn An" autocomplete="name">
  <div class="row"><button class="primary" id="go">Bắt đầu làm bài</button></div>
</section>`;
document.getElementById("go").onclick=()=>{S.name=document.getElementById("nm").value.trim();startClock();startSec("L")}}

function startSec(sec){S.sec=sec;next()}

function pick(sec){const st=S.secs[sec];
  const cnt={};st.hist.forEach(h=>cnt[h.item.les]=(cnt[h.item.les]||0)+1);
  for(const lv of [st.level,st.level-1,st.level+1,st.level-2,st.level+2]){
    let pool=BANK.filter(i=>i.s===sec&&i.lv===lv&&!st.used.has(i.id)&&!(i.g&&st.groups.has(i.g)));
    if(!pool.length)continue;
    const min=Math.min(...pool.map(i=>cnt[i.les]||0));
    pool=pool.filter(i=>(cnt[i.les]||0)===min);
    return pool[Math.floor(Math.random()*pool.length)]}
  return null}

function next(){if(S.timeUp)return;const st=S.secs[S.sec];
  if(st.hist.length>=LEN[S.sec]){S.sec==="L"?between():results();return}
  const item=pick(S.sec);if(!item){S.sec==="L"?between():results();return}
  st.used.add(item.id);if(item.g)st.groups.add(item.g);
  S.cur={item,order:shuffle(item.o.map((t,i)=>({t,i})))};S.choice=null;S.plays=0;render()}

function render(){const st=S.secs[S.sec],it=S.cur.item,n=st.hist.length+1,N=LEN[S.sec];
  stepEl.textContent=`${S.sec==="L"?"Nghe":"Đọc"} · ${n}/${N}`;
  const listen=S.sec==="L";
  const opts=it.po
    ?`<div class="opts pics">${S.cur.order.map((o,j)=>`<button class="opt" data-i="${o.i}" aria-pressed="false"><span class="k">${"ABC"[j]}</span>${pic(o.t,"Hình "+"ABC"[j])}</button>`).join("")}</div>`
    :`<div class="opts">${S.cur.order.map((o,j)=>`<button class="opt" data-i="${o.i}" aria-pressed="false"><span class="k">${"ABC"[j]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`;
  app.innerHTML=`<section class="card">
   <div class="bar"><span class="label">${listen?"聽力 Nghe":"閱讀 Đọc"}</span>
     <span class="meter">${meter(st.level)} độ khó ${st.level}/3</span></div>
   ${listen?`<div class="play"><button class="ghost" id="pl">▶ Nghe (còn <span id="left">2</span> lần)</button>
      ${!synth||!voice?`<span class="notice">Thiết bị này chưa có giọng đọc tiếng Trung. Hãy thử Chrome hoặc Safari, hoặc nhờ giáo viên đọc. <button class="ghost" id="tr" style="padding:4px 10px;margin-left:4px">Hiện lời thoại</button></span>`:""}</div>
      ${cast(it.a)}
      <div class="transcript" id="tx" hidden>${it.a.map(([s,t])=>`${s?s+"：":""}${esc(t)}`).join("<br>")}</div>`:""}
   ${it.img?`<div class="figure">${pic(it.img,"Hình minh họa")}</div>`:""}
   ${!listen&&it.t?`<div class="passage">${esc(it.t).replace(/\n/g,"<br>")}</div>`:""}
   <p class="q${/[a-zA-Zà-ỹÀ-Ỹ]/.test(it.q)?" qv":""}">${esc(it.q)}</p>
   ${opts}
   <div class="row"><button class="primary" id="nx" disabled>${n===N?"Hoàn thành phần này":"Câu tiếp theo"}</button></div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.choice=+b.dataset.i;
    app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));document.getElementById("nx").disabled=false});
  document.getElementById("nx").onclick=answer;
  if(listen){const pl=document.getElementById("pl");
    pl.onclick=()=>{if(S.plays>=2)return;S.plays++;document.getElementById("left").textContent=2-S.plays;
      pl.disabled=true;speak(it.a,()=>{pl.disabled=S.plays>=2})};
    const tr=document.getElementById("tr");if(tr)tr.onclick=()=>{document.getElementById("tx").hidden=false;tr.remove()}}}

function answer(){if(synth)synth.cancel();
  const st=S.secs[S.sec],it=S.cur.item,ok=S.choice===it.k;
  st.hist.push({item:it,chosen:S.choice,ok,level:st.level});
  if(ok){st.streak++;if(st.streak>=2&&st.level<3){st.level++;st.streak=0}}
  else{st.streak=0;if(st.level>1)st.level--}
  next()}

function between(){stepEl.textContent="Hết phần Nghe";
  app.innerHTML=`<section class="card"><span class="label">Xong phần 1/2</span>
   <h2>Phần Nghe đã xong. Tiếp theo là phần Đọc.</h2>
   <p class="muted">Phần Đọc có ${LEN.R} câu và bắt đầu lại ở độ khó 2. Đồng hồ vẫn tiếp tục chạy.</p>
   <div class="row"><button class="primary" id="go">Bắt đầu phần Đọc</button></div></section>`;
  document.getElementById("go").onclick=()=>startSec("R")}

function trace(hist,N){if(!hist.length)return `<p class="muted">Chưa làm câu nào.</p>`;
  const W=320,H=110,px=24,py=14,xs=(W-px-10)/Math.max(1,N-1),y=l=>py+(3-l)*((H-py*2-14)/2);
  const pts=hist.map((h,i)=>[px+i*xs,y(h.level)]);
  return `<svg class="trace" viewBox="0 0 ${W} ${H}" role="img" aria-label="Đường đi độ khó qua từng câu">
   ${[1,2,3].map(l=>`<line class="grid" x1="${px}" x2="${W-10}" y1="${y(l)}" y2="${y(l)}"/><text x="4" y="${y(l)+4}">${l}</text>`).join("")}
   <polyline class="path" points="${pts.map(p=>p.join(",")).join(" ")}"/>
   ${pts.map((p,i)=>`<circle class="${hist[i].ok?"dot-ok":"dot-bad"}" cx="${p[0]}" cy="${p[1]}" r="4"/>`).join("")}
   ${pts.map((p,i)=>(i%2===0||i===pts.length-1)?`<text x="${p[0]-4}" y="${H-2}">${i+1}</text>`:"").join("")}</svg>`}

function results(){if(timer){clearInterval(timer);timer=null}
  const used=Math.round((Date.now()-(S.deadline-MINUTES*60000))/60000);
  stepEl.textContent="Kết quả";
  const all=[...S.secs.L.hist,...S.secs.R.hist];
  const pL=secPoints(S.secs.L.hist),pR=secPoints(S.secs.R.hist),total=pL+pR,[,gName,gAdv]=grade(total);
  const sec=k=>{const st=S.secs[k],c=st.hist.filter(h=>h.ok).length;
    return `<div class="card"><span class="label">${k==="L"?"聽力 Nghe":"閱讀 Đọc"}</span>
     <div class="row"><span class="big">${k==="L"?pL:pR}<small class="muted" style="font-size:16px">/50</small></span><span class="pill">${secLevel(st.hist)}</span></div>
     <p class="muted" style="font-size:13px">Đúng ${c}/${LEN[k]} câu${st.hist.length<LEN[k]?` · mới làm ${st.hist.length}/${LEN[k]} câu`:""}</p>
     ${trace(st.hist,LEN[k])}
     <p class="muted" style="font-size:13px">Chấm xanh: đúng · vòng đỏ: sai · trục dọc: độ khó của câu.</p></div>`};
  const rows=[1,2,3,4,5].map(l=>{const h=all.filter(x=>x.item.les===l),c=h.filter(x=>x.ok).length,p=h.length?Math.round(c/h.length*100):0;
    return `<tr><td><b>L${l}</b></td><td class="zht">${LESSONS[l]}</td><td>${c}/${h.length}</td>
      <td><div class="barcell"><div class="hbar"><span style="width:${p}%"></span></div>${h.length?p+"%":"–"}</div></td></tr>`}).join("");
  const rev=all.map(h=>{const it=h.item,stem=it.s==="L"?it.a.map(([s,t])=>(s?s+"：":"")+esc(t)).join(" "):(it.img?`[Hình: ${esc(alt(it.img))}] `:"")+esc(it.t||"");
    return `<div>
    <span class="${h.ok?"tag-ok":"tag-bad"}">${h.ok?"Đúng":"Sai"}</span> · ${it.s==="L"?"Nghe":"Đọc"} · L${it.les} · độ khó ${it.lv}${it.po?" · chọn hình":""}
    <div class="zhs">${stem} <b>${esc(it.q)}</b></div>
    <div class="zhs">Đáp án: ${esc(optText(it,it.k))}${h.ok?"":` · Đã chọn: ${esc(optText(it,h.chosen))}`}</div></div>`}).join("");
  app.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">
   <section class="card"><span class="label">Kết quả${S.timeUp?" · Hết giờ":""}</span>
    <h1>${S.name?esc(S.name):"Học viên"}</h1>
    <div class="row" style="align-items:baseline;gap:14px"><span class="big" style="font-size:44px">${total}<small class="muted" style="font-size:18px">/100</small></span>
      <span class="pill" style="font-size:14px">${gName}</span></div>
    <p><b>Đề xuất:</b> ${gAdv}</p>
    <p class="muted">${new Date().toLocaleString("vi-VN")} · Thời gian làm: ${Math.min(used,MINUTES)} phút</p><p id="sendst" class="muted">${SHEET_URL?"Đang gửi kết quả cho giáo viên…":"Chụp màn hình này gửi giáo viên."}</p></section>
   <div class="stats">${sec("L")}${sec("R")}</div>
   <section class="card"><h2>Theo từng bài</h2>
    <div class="tbl"><table><thead><tr><th>Bài</th><th>Chủ đề</th><th>Đúng</th><th>Tỉ lệ</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="muted" style="font-size:13px">Số câu mỗi bài khác nhau vì đề tự chọn câu theo trình độ.</p>
    <details><summary>Cách tính điểm</summary><div class="rev"><div>
      Mỗi phần Nghe, Đọc tối đa <b>50 điểm</b>, cộng lại tối đa <b>100</b>. Điểm không đếm số câu đúng đơn thuần mà ước lượng trình độ từ việc
      bạn làm đúng câu ở độ khó nào: đúng câu khó (mức 3) được tính nhiều hơn câu dễ (mức 1).
      Xếp loại: ≥80 Giỏi · 65–79 Khá · 50–64 Trung bình · dưới 50 Yếu.</div></div></details>
    <details><summary>Xem lại từng câu</summary><div class="rev">${rev}</div></details></section>
   <div class="row"><button class="ghost" id="again">Làm lại từ đầu</button></div></div>`;
  document.getElementById("again").onclick=()=>{reset();intro()};
  sendResult(all,Math.min(used,MINUTES),{pL,pR,total,gName,gAdv})}

function sendResult(all,minutes,sc){if(!SHEET_URL||S.sent)return;S.sent=true;
  const right=k=>`${S.secs[k].hist.filter(h=>h.ok).length}/${LEN[k]}`;
  const les=l=>{const h=all.filter(x=>x.item.les===l);return `${h.filter(x=>x.ok).length}/${h.length}`};
  const wrong=all.filter(h=>!h.ok).map(h=>`${h.item.s==="L"?"Nghe":"Đọc"} L${h.item.les}: ${h.item.q} → chọn ${optText(h.item,h.chosen)} (đúng: ${optText(h.item,h.item.k)})`).join("\n");
  // [tên cột, giá trị]: muốn thêm/bớt cột chỉ cần sửa ở đây, Apps Script tự tạo tiêu đề
  const d={sheet:"Bảng điểm",cols:[["Họ tên",S.name||"(không tên)"],["Tổng điểm /100",sc.total],["Xếp loại",sc.gName],["Đề xuất",sc.gAdv],
    ["Nghe /50",sc.pL],["Mức Nghe",secLevel(S.secs.L.hist)],["Nghe đúng",right("L")],
    ["Đọc /50",sc.pR],["Mức Đọc",secLevel(S.secs.R.hist)],["Đọc đúng",right("R")],
    ["L1",les(1)],["L2",les(2)],["L3",les(3)],["L4",les(4)],["L5",les(5)],
    ["Số phút làm",minutes],["Hết giờ?",S.timeUp?"Có":"Không"],["Các câu sai",wrong],["Email",(window.SiteUser&&SiteUser.get()&&SiteUser.get().email)||""]]};
  const st=document.getElementById("sendst");
  fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)})
    .then(()=>{if(st)st.textContent="✓ Đã gửi kết quả cho giáo viên."})
    .catch(()=>{S.sent=false;if(st)st.textContent="Chưa gửi được kết quả (mất mạng?). Hãy chụp màn hình này gửi giáo viên."})}

reset();intro();
</script>
